<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05122A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77DFF"/>
      <stop offset="1" stop-color="#05122A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .s { animation: run 3.5s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(900px); } }
  </style>
  <rect y="3" width="900" height="2" rx="1" fill="url(#line)"/>
  <rect class="s" y="2" width="200" height="4" rx="2" fill="url(#shine)" opacity="0.85"/>
</svg>
